<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - VetConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>VetConnect</h1>
    </header>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">VetConnect</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="mascotas.html">Mascotas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <main>

        <div class="container mt-5">

            <h2>Mascotas registradas</h2>

            <!-- Alerts -->

            <div class="alert alert-success">
                Mascota registrada correctamente.
            </div>

            <div class="alert alert-danger">
                No fue posible registrar la mascota.
            </div>

            <!-- Botón para abrir el Modal -->

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalMascota">
                Nueva mascota
            </button>

            <!-- Modal -->

            <div class="modal fade" id="modalMascota">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title">Nueva mascota</h5>
                            <button class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div class="modal-body">
                            Formulario de mascota
                        </div>

                    </div>
                </div>
            </div>

            <!-- Tabla de mascotas -->

            <div class="table-responsive">
                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Edad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>Firulais</td>
                            <td>Perro</td>
                            <td>5</td>
                            <td>
                                <span class="badge bg-success">Activo</span>
                            </td>
                        </tr>

                        <tr>
                            <td>Michi</td>
                            <td>Gato</td>
                            <td>3</td>
                            <td>
                                <span class="badge bg-success">Activo</span>
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
